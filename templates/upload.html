<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#6366f1">
    <title>AI 文件总结助手</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/upload.css">
</head>
<body>
    <div class="app-container">
        <!-- 背景装饰 -->
        <div class="bg-decoration">
            <div class="bg-gradient"></div>
            <div class="bg-pattern"></div>
        </div>

        <!-- 导航栏 -->
        <nav class="navbar">
            <a href="/" class="nav-back">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                <span>返回日记</span>
            </a>
            <div class="nav-brand">
                <div class="brand-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <line x1="16" y1="13" x2="8" y2="13"/>
                        <line x1="16" y1="17" x2="8" y2="17"/>
                        <polyline points="10 9 9 9 8 9"/>
                    </svg>
                </div>
                <span class="brand-text">AI 文件助手</span>
            </div>
            <div class="nav-spacer"></div>
        </nav>

        <!-- 主内容区 -->
        <main class="main-content">
            <!-- 头部 -->
            <header class="page-header">
                <h1 class="page-title">智能文件分析</h1>
                <p class="page-subtitle">支持 TXT、DOCX、XLSX、PDF 格式，AI 自动提取关键信息</p>
            </header>

            <!-- 认证区域 -->
            <section class="auth-container" id="authSection">
                <div class="auth-card">
                    <div class="auth-tabs">
                        <button class="auth-tab active" data-tab="login" onclick="switchAuthTab('login')">
                            <span class="tab-text">登录</span>
                        </button>
                        <button class="auth-tab" data-tab="register" onclick="switchAuthTab('register')">
                            <span class="tab-text">注册</span>
                        </button>
                        <div class="tab-indicator"></div>
                    </div>

                    <!-- 登录表单 -->
                    <form class="auth-form active" id="loginForm" onsubmit="event.preventDefault(); login();">
                        <div class="form-group">
                            <label class="form-label" for="loginEmail">邮箱地址</label>
                            <div class="input-wrapper">
                                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                                    <polyline points="22,6 12,13 2,6"/>
                                </svg>
                                <input type="email" id="loginEmail" class="form-input" placeholder="your@email.com" required autocomplete="email">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="loginPassword">密码</label>
                            <div class="input-wrapper">
                                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                                </svg>
                                <input type="password" id="loginPassword" class="form-input" placeholder="输入密码" required autocomplete="current-password">
                                <button type="button" class="password-toggle" onclick="togglePassword('loginPassword')">
                                    <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                        <circle cx="12" cy="12" r="3"/>
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary btn-full">
                            <span class="btn-text">登录</span>
                            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="5" y1="12" x2="19" y2="12"/>
                                <polyline points="12 5 19 12 12 19"/>
                            </svg>
                        </button>
                    </form>

                    <!-- 注册表单 -->
                    <form class="auth-form" id="registerForm" onsubmit="event.preventDefault(); register();">
                        <div class="form-group">
                            <label class="form-label" for="regUsername">用户名</label>
                            <div class="input-wrapper">
                                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                    <circle cx="12" cy="7" r="4"/>
                                </svg>
                                <input type="text" id="regUsername" class="form-input" placeholder="设置用户名" required autocomplete="username">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="regEmail">邮箱地址</label>
                            <div class="input-wrapper">
                                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                                    <polyline points="22,6 12,13 2,6"/>
                                </svg>
                                <input type="email" id="regEmail" class="form-input" placeholder="your@email.com" required autocomplete="email">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="regPassword">密码</label>
                            <div class="input-wrapper">
                                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                                </svg>
                                <input type="password" id="regPassword" class="form-input" placeholder="设置密码（至少6位）" required autocomplete="new-password" minlength="6">
                                <button type="button" class="password-toggle" onclick="togglePassword('regPassword')">
                                    <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                        <circle cx="12" cy="12" r="3"/>
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary btn-full">
                            <span class="btn-text">创建账户</span>
                            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="5" y1="12" x2="19" y2="12"/>
                                <polyline points="12 5 19 12 12 19"/>
                            </svg>
                        </button>
                    </form>
                </div>
            </section>

            <!-- 上传区域 -->
            <section class="upload-container" id="uploadSection" style="display: none;">
                <!-- 用户信息栏 -->
                <div class="user-bar">
                    <div class="user-info">
                        <div class="user-avatar">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                <circle cx="12" cy="7" r="4"/>
                            </svg>
                        </div>
                        <div class="user-details">
                            <span class="user-greeting">欢迎回来</span>
                            <span class="user-name" id="username">用户</span>
                        </div>
                    </div>
                    <button class="btn btn-ghost btn-sm" onclick="logout()">
                        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                            <polyline points="16 17 21 12 16 7"/>
                            <line x1="21" y1="12" x2="9" y2="12"/>
                        </svg>
                        <span>退出</span>
                    </button>
                </div>

                <!-- 上传模式切换 -->
                <div class="upload-mode-tabs">
                    <button class="mode-tab active" data-mode="simple" onclick="switchUploadMode('simple')">
                        <div class="mode-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                <polyline points="17 8 12 3 7 8"/>
                                <line x1="12" y1="3" x2="12" y2="15"/>
                            </svg>
                        </div>
                        <div class="mode-info">
                            <span class="mode-title">普通上传</span>
                            <span class="mode-desc">适合小文件</span>
                        </div>
                    </button>
                    <button class="mode-tab" data-mode="chunked" onclick="switchUploadMode('chunked')">
                        <div class="mode-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                                <path d="M2 17l10 5 10-5"/>
                                <path d="M2 12l10 5 10-5"/>
                            </svg>
                        </div>
                        <div class="mode-info">
                            <span class="mode-title">大文件上传</span>
                            <span class="mode-desc">支持最大 50MB</span>
                        </div>
                    </button>
                </div>

                <!-- 普通上传区域 -->
                <div class="upload-card" id="simpleUpload">
                    <div class="drop-zone" id="dropZone">
                        <input type="file" id="fileInput" accept=".txt,.docx,.xlsx,.pdf" hidden>
                        <div class="drop-content">
                            <div class="drop-icon-wrapper">
                                <div class="drop-icon">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                        <polyline points="17 8 12 3 7 8"/>
                                        <line x1="12" y1="3" x2="12" y2="15"/>
                                    </svg>
                                </div>
                                <div class="drop-icon-bg"></div>
                            </div>
                            <h3 class="drop-title">拖拽文件到这里</h3>
                            <p class="drop-subtitle">或点击选择文件</p>
                            <div class="drop-formats">
                                <span class="format-tag">TXT</span>
                                <span class="format-tag">DOCX</span>
                                <span class="format-tag">XLSX</span>
                                <span class="format-tag">PDF</span>
                            </div>
                        </div>
                    </div>
                    <div class="file-preview" id="fileInfo"></div>
                </div>

                <!-- 大文件上传区域 -->
                <div class="upload-card" id="chunkedUpload" style="display: none;">
                    <div class="drop-zone" id="chunkedDropZone">
                        <input type="file" id="chunkedFileInput" accept=".txt,.docx,.xlsx,.pdf" hidden>
                        <div class="drop-content">
                            <div class="drop-icon-wrapper">
                                <div class="drop-icon large">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                                        <path d="M2 17l10 5 10-5"/>
                                        <path d="M2 12l10 5 10-5"/>
                                    </svg>
                                </div>
                                <div class="drop-icon-bg large"></div>
                            </div>
                            <h3 class="drop-title">拖拽大文件到这里</h3>
                            <p class="drop-subtitle">支持最大 50MB 的文件</p>
                            <div class="drop-formats">
                                <span class="format-tag">TXT</span>
                                <span class="format-tag">DOCX</span>
                                <span class="format-tag">XLSX</span>
                                <span class="format-tag">PDF</span>
                            </div>
                        </div>
                    </div>
                    <div class="file-preview" id="chunkedFileInfo"></div>
                    
                    <!-- 进度条 -->
                    <div class="progress-panel" id="chunkedProgress" style="display: none;">
                        <div class="progress-header">
                            <span class="progress-label">上传进度</span>
                            <span class="progress-percent" id="progressText">0%</span>
                        </div>
                        <div class="progress-bar-container">
                            <div class="progress-track">
                                <div class="progress-fill" id="progressFill"></div>
                            </div>
                        </div>
                        <div class="progress-meta">
                            <span class="chunk-status" id="chunkInfo">准备上传...</span>
                        </div>
                    </div>
                </div>

                <!-- 分析结果 -->
                <div class="result-card" id="resultSection" style="display: none;">
                    <div class="result-header">
                        <div class="result-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                                <polyline points="14 2 14 8 20 8"/>
                                <line x1="16" y1="13" x2="8" y2="13"/>
                                <line x1="16" y1="17" x2="8" y2="17"/>
                                <polyline points="10 9 9 9 8 9"/>
                            </svg>
                        </div>
                        <div class="result-title-group">
                            <h2 class="result-title">AI 分析结果</h2>
                            <span class="result-subtitle">智能提取关键信息</span>
                        </div>
                    </div>

                    <div class="result-content">
                        <div class="result-meta-grid">
                            <div class="meta-item">
                                <span class="meta-label">文件名</span>
                                <span class="meta-value" id="resultFilename">-</span>
                            </div>
                            <div class="meta-item">
                                <span class="meta-label">文件大小</span>
                                <span class="meta-value" id="resultSize">-</span>
                            </div>
                            <div class="meta-item full">
                                <span class="meta-label">文档类别</span>
                                <span class="meta-badge" id="resultCategory">-</span>
                            </div>
                        </div>

                        <div class="result-section">
                            <h3 class="section-title">
                                <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                                    <polyline points="14 2 14 8 20 8"/>
                                    <line x1="16" y1="13" x2="8" y2="13"/>
                                    <line x1="16" y1="17" x2="8" y2="17"/>
                                    <polyline points="10 9 9 9 8 9"/>
                                </svg>
                                内容总结
                            </h3>
                            <div class="summary-box">
                                <p class="summary-text" id="resultSummary">-</p>
                            </div>
                        </div>

                        <div class="result-section">
                            <h3 class="section-title">
                                <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                                </svg>
                                关键要点
                            </h3>
                            <ul class="key-points-list" id="resultKeyPoints"></ul>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <!-- Toast 提示 -->
        <div class="toast-container" id="toastContainer">
            <div class="toast" id="toast">
                <div class="toast-icon" id="toastIcon"></div>
                <div class="toast-content">
                    <span class="toast-message" id="toastMessage"></span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        let token = localStorage.getItem('token');
        let currentUploadMode = 'simple';
        let isUploading = false;

        // DOM 加载完成后初始化
        document.addEventListener('DOMContentLoaded', () => {
            if (token) {
                showUploadSection();
            } else {
                showAuthSection();
            }

            // 初始化拖拽区域
            setupDropZone('dropZone', 'fileInput', handleSimpleFileSelect);
            setupDropZone('chunkedDropZone', 'chunkedFileInput', handleChunkedFileSelect);

            // 点击上传区域触发文件选择
            document.getElementById('dropZone').addEventListener('click', (e) => {
                if (e.target.closest('.drop-zone')) {
                    document.getElementById('fileInput').click();
                }
            });

            document.getElementById('chunkedDropZone').addEventListener('click', (e) => {
                if (e.target.closest('.drop-zone')) {
                    document.getElementById('chunkedFileInput').click();
                }
            });
        });

        // 设置拖拽区域
        function setupDropZone(zoneId, inputId, callback) {
            const dropZone = document.getElementById(zoneId);
            const fileInput = document.getElementById(inputId);

            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                dropZone.addEventListener(eventName, preventDefaults, false);
            });

            function preventDefaults(e) {
                e.preventDefault();
                e.stopPropagation();
            }

            ['dragenter', 'dragover'].forEach(eventName => {
                dropZone.addEventListener(eventName, () => {
                    dropZone.classList.add('dragover');
                }, false);
            });

            ['dragleave', 'drop'].forEach(eventName => {
                dropZone.addEventListener(eventName, () => {
                    dropZone.classList.remove('dragover');
                }, false);
            });

            dropZone.addEventListener('drop', (e) => {
                const files = e.dataTransfer.files;
                if (files.length > 0 && !isUploading) {
                    callback(files[0]);
                }
            }, false);

            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0 && !isUploading) {
                    callback(e.target.files[0]);
                }
            });
        }

        // 切换认证标签
        function switchAuthTab(tab) {
            const tabs = document.querySelectorAll('.auth-tab');
            const forms = document.querySelectorAll('.auth-form');
            const indicator = document.querySelector('.tab-indicator');

            tabs.forEach(t => t.classList.remove('active'));
            forms.forEach(f => f.classList.remove('active'));

            const activeTab = document.querySelector(`[data-tab="${tab}"]`);
            activeTab.classList.add('active');
            document.getElementById(tab + 'Form').classList.add('active');

            // 移动指示器
            const tabRect = activeTab.getBoundingClientRect();
            const containerRect = activeTab.parentElement.getBoundingClientRect();
            indicator.style.transform = `translateX(${tabRect.left - containerRect.left}px)`;
            indicator.style.width = `${tabRect.width}px`;
        }

        // 切换密码显示
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const type = input.type === 'password' ? 'text' : 'password';
            input.type = type;
        }

        // 切换上传模式
        function switchUploadMode(mode) {
            if (isUploading) return;
            
            currentUploadMode = mode;
            const tabs = document.querySelectorAll('.mode-tab');
            tabs.forEach(tab => {
                tab.classList.toggle('active', tab.dataset.mode === mode);
            });

            document.getElementById('simpleUpload').style.display = mode === 'simple' ? 'block' : 'none';
            document.getElementById('chunkedUpload').style.display = mode === 'chunked' ? 'block' : 'none';
            document.getElementById('resultSection').style.display = 'none';
        }

        // 登录
        async function login() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const btn = document.querySelector('#loginForm .btn-primary');

            if (!email || !password) {
                showToast('请填写邮箱和密码', 'error');
                return;
            }

            setLoading(btn, true);

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `username=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`
                });

                if (response.ok) {
                    const data = await response.json();
                    token = data.access_token;
                    localStorage.setItem('token', token);
                    showToast('登录成功', 'success');
                    showUploadSection();
                } else {
                    const error = await response.json();
                    showToast(error.detail || '登录失败，请检查邮箱和密码', 'error');
                }
            } catch (error) {
                showToast('网络错误，请稍后重试', 'error');
            } finally {
                setLoading(btn, false);
            }
        }

        // 注册
        async function register() {
            const username = document.getElementById('regUsername').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const btn = document.querySelector('#registerForm .btn-primary');

            if (!username || !email || !password) {
                showToast('请填写所有字段', 'error');
                return;
            }

            if (password.length < 6) {
                showToast('密码至少需要6位', 'error');
                return;
            }

            setLoading(btn, true);

            try {
                const response = await fetch('/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });

                if (response.ok) {
                    showToast('注册成功，请登录', 'success');
                    switchAuthTab('login');
                    document.getElementById('loginEmail').value = email;
                } else {
                    const error = await response.json();
                    showToast(error.detail || '注册失败', 'error');
                }
            } catch (error) {
                showToast('网络错误，请稍后重试', 'error');
            } finally {
                setLoading(btn, false);
            }
        }

        // 退出登录
        function logout() {
            token = null;
            localStorage.removeItem('token');
            showToast('已退出登录', 'info');
            showAuthSection();
        }

        // 显示认证区域
        function showAuthSection() {
            document.getElementById('authSection').style.display = 'block';
            document.getElementById('uploadSection').style.display = 'none';
            
            // 初始化标签指示器
            setTimeout(() => {
                const activeTab = document.querySelector('.auth-tab.active');
                if (activeTab) {
                    const indicator = document.querySelector('.tab-indicator');
                    const tabRect = activeTab.getBoundingClientRect();
                    const containerRect = activeTab.parentElement.getBoundingClientRect();
                    indicator.style.transform = `translateX(${tabRect.left - containerRect.left}px)`;
                    indicator.style.width = `${tabRect.width}px`;
                }
            }, 100);
        }

        // 显示上传区域
        async function showUploadSection() {
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('uploadSection').style.display = 'block';
            
            try {
                const response = await fetch('/me', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.ok) {
                    const user = await response.json();
                    document.getElementById('username').textContent = user.username;
                }
            } catch (error) {
                console.error('获取用户信息失败');
            }
        }

        // 普通文件上传
        async function handleSimpleFileSelect(file) {
            if (!validateFile(file)) return;
            
            showFileInfo(file, 'fileInfo');
            document.getElementById('resultSection').style.display = 'none';
            isUploading = true;

            const formData = new FormData();
            formData.append('file', file);

            showToast('正在上传并分析...', 'info');

            try {
                const response = await fetch('/upload-file', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: formData
                });

                if (response.ok) {
                    const result = await response.json();
                    displayResult(result, file.size);
                    showToast('分析完成！', 'success');
                } else {
                    const error = await response.json();
                    showToast(error.detail || '上传失败', 'error');
                }
            } catch (error) {
                showToast('网络错误', 'error');
            } finally {
                isUploading = false;
            }
        }

        // 大文件分片上传
        async function handleChunkedFileSelect(file) {
            if (!validateFile(file)) return;
            
            showFileInfo(file, 'chunkedFileInfo');
            document.getElementById('resultSection').style.display = 'none';
            document.getElementById('chunkedProgress').style.display = 'block';
            isUploading = true;

            const CHUNK_SIZE = 1 * 1024 * 1024;
            const totalChunks = Math.ceil(file.size / CHUNK_SIZE);
            let uploadedChunks = 0;

            updateProgress(0, '准备上传...');

            try {
                // 初始化上传
                const initResponse = await fetch('/upload/init', {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: `filename=${encodeURIComponent(file.name)}&total_size=${file.size}`
                });

                if (!initResponse.ok) {
                    const error = await initResponse.json();
                    throw new Error(error.detail || '初始化失败');
                }

                const initData = await initResponse.json();
                const fileId = initData.file_id;

                // 上传分片
                for (let i = 0; i < totalChunks; i++) {
                    const start = i * CHUNK_SIZE;
                    const end = Math.min(start + CHUNK_SIZE, file.size);
                    const chunk = file.slice(start, end);

                    const formData = new FormData();
                    formData.append('file_id', fileId);
                    formData.append('chunk_number', i + 1);
                    formData.append('total_chunks', totalChunks);
                    formData.append('chunk', chunk);

                    const response = await fetch('/upload/chunk', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` },
                        body: formData
                    });

                    if (!response.ok) {
                        throw new Error('分片上传失败');
                    }

                    uploadedChunks++;
                    const progress = Math.round((uploadedChunks / totalChunks) * 100);
                    updateProgress(progress, `上传中: ${uploadedChunks}/${totalChunks} 分片`);
                }

                // 完成上传
                updateProgress(100, '正在分析...');
                
                const completeResponse = await fetch('/upload/complete', {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: `file_id=${fileId}&filename=${encodeURIComponent(file.name)}`
                });

                if (completeResponse.ok) {
                    const result = await completeResponse.json();
                    displayResult(result, file.size);
                    showToast('分析完成！', 'success');
                } else {
                    const error = await completeResponse.json();
                    throw new Error(error.detail || '合并失败');
                }

            } catch (error) {
                showToast(error.message, 'error');
            } finally {
                isUploading = false;
                setTimeout(() => {
                    document.getElementById('chunkedProgress').style.display = 'none';
                }, 1000);
            }
        }

        // 验证文件
        function validateFile(file) {
            const validTypes = ['.txt', '.docx', '.xlsx', '.pdf'];
            const ext = '.' + file.name.split('.').pop().toLowerCase();
            
            if (!validTypes.includes(ext)) {
                showToast('不支持的文件格式', 'error');
                return false;
            }
            
            return true;
        }

        // 更新进度
        function updateProgress(percent, text) {
            document.getElementById('progressFill').style.width = `${percent}%`;
            document.getElementById('progressText').textContent = `${percent}%`;
            document.getElementById('chunkInfo').textContent = text;
        }

        // 显示文件信息
        function showFileInfo(file, elementId) {
            const info = document.getElementById(elementId);
            const ext = file.name.split('.').pop().toUpperCase();
            
            info.innerHTML = `
                <div class="file-item">
                    <div class="file-icon file-icon-${ext.toLowerCase()}">
                        <span>${ext}</span>
                    </div>
                    <div class="file-details">
                        <span class="file-name">${file.name}</span>
                        <span class="file-size">${formatSize(file.size)}</span>
                    </div>
                    <button class="file-remove" onclick="clearFile('${elementId}')">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"/>
                            <line x1="6" y1="6" x2="18" y2="18"/>
                        </svg>
                    </button>
                </div>
            `;
        }

        // 清除文件
        function clearFile(elementId) {
            document.getElementById(elementId).innerHTML = '';
            if (elementId === 'fileInfo') {
                document.getElementById('fileInput').value = '';
            } else {
                document.getElementById('chunkedFileInput').value = '';
                document.getElementById('chunkedProgress').style.display = 'none';
            }
            document.getElementById('resultSection').style.display = 'none';
        }

        // 格式化文件大小
        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        // 显示结果
        function displayResult(result, fileSize) {
            const resultSection = document.getElementById('resultSection');
            resultSection.style.display = 'block';
            resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
            
            document.getElementById('resultFilename').textContent = result.filename;
            document.getElementById('resultSize').textContent = formatSize(fileSize);
            document.getElementById('resultCategory').textContent = result.category;
            document.getElementById('resultSummary').textContent = result.summary;
            
            const keyPoints = document.getElementById('resultKeyPoints');
            keyPoints.innerHTML = '';
            result.key_points.forEach((point, index) => {
                const li = document.createElement('li');
                li.style.animationDelay = `${index * 0.1}s`;
                li.innerHTML = `
                    <span class="point-marker">${index + 1}</span>
                    <span class="point-text">${point}</span>
                `;
                keyPoints.appendChild(li);
            });
        }

        // 设置按钮加载状态
        function setLoading(btn, loading) {
            btn.disabled = loading;
            btn.classList.toggle('loading', loading);
        }

        // 显示 Toast
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');
            
            toast.className = `toast toast-${type}`;
            toastMessage.textContent = message;
            
            // 设置图标
            const icons = {
                success: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>',
                error: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
                info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>'
            };
            toastIcon.innerHTML = icons[type] || icons.info;
            
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
