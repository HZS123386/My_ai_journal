<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 日记助手</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
</head>
<body>
    <div class="app-container">
        <!-- 背景装饰 -->
        <div class="bg-decoration" aria-hidden="true">
            <div class="bg-pattern"></div>
        </div>

        <!-- 侧边栏 -->
        <aside class="sidebar" id="sidebar" role="navigation" aria-label="侧边导航">
            <!-- 侧边栏头部 -->
            <div class="sidebar-header">
                <div class="user-avatar" role="button" tabindex="0" aria-label="用户头像">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=user" alt="用户头像" class="avatar-img">
                    <span class="avatar-text" id="sidebarUserName"></span>
                </div>
            </div>

            <!-- 新对话按钮 -->
            <button class="btn btn-primary btn-new-chat" onclick="newEntry()" aria-label="新建日记">
                <span>新日记</span>
            </button>

            <!-- 侧边栏菜单 -->
            <nav class="sidebar-menu" aria-label="侧边栏菜单">
                <button class="sidebar-menu-item" onclick="window.location.href='/upload'" aria-label="文件上传">
                    <span>文件上传</span>
                </button>
            </nav>

            <!-- 历史记录区域 -->
            <div class="history-section">
                <div class="history-header">
                    <span class="history-title">历史记录</span>
                </div>
                <div class="history-list" id="historyList" role="list"></div>
            </div>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content" role="main" id="mainContent">
            <!-- 导航栏 -->
            <nav class="navbar" role="navigation" aria-label="主导航">
                <div class="navbar-content">
                    <div class="nav-left">
                        <button class="navbar-sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()" aria-label="切换侧边栏显示">
                            <span class="toggle-icon">☰</span>
                        </button>
                        <div class="nav-brand">
                            <span class="brand-text">AI 日记助手</span>
                        </div>
                    </div>
                    <div class="nav-actions">
                        <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="切换主题">
                            <span class="theme-icon">🌙</span>
                            <span class="theme-text">深色</span>
                        </button>
                        <div class="user-info-nav">
                            <span class="user-greeting-nav">你好</span>
                            <span class="user-name-nav" id="currentUserText"></span>
                        </div>
                        <button class="btn btn-ghost btn-sm" onclick="logout()" aria-label="退出登录">
                            <span>退出</span>
                        </button>
                    </div>
                </div>
            </nav>

            <!-- 内容区域 -->
            <div class="content-wrapper">
                <!-- 认证区域 -->
                <section class="auth-container" id="authBox" aria-labelledby="authTitle">
                    <div class="auth-card">
                        <!-- 品牌 Logo -->
                        <div class="auth-brand">
                            <div class="brand-logo">
                                <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <rect width="48" height="48" rx="12" fill="url(#logoGradient)"/>
                                    <path d="M14 24C14 18.4772 18.4772 14 24 14C29.5228 14 34 18.4772 34 24C34 29.5228 29.5228 34 24 34" stroke="white" stroke-width="3" stroke-linecap="round"/>
                                    <path d="M24 34C20.6863 34 18 31.3137 18 28C18 24.6863 20.6863 22 24 22C27.3137 22 30 24.6863 30 28C30 31.3137 27.3137 34 24 34Z" fill="white" fill-opacity="0.9"/>
                                    <defs>
                                        <linearGradient id="logoGradient" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
                                            <stop stop-color="#8B5CF6"/>
                                            <stop offset="1" stop-color="#6366F1"/>
                                        </linearGradient>
                                    </defs>
                                </svg>
                            </div>
                            <h1 class="brand-name">AI 日记助手</h1>
                            <p class="brand-tagline">记录每一天，AI 为你总结</p>
                        </div>

                        <!-- Tab 切换 -->
                        <div class="auth-tabs" role="tablist" aria-label="登录或注册">
                            <button class="auth-tab active" 
                                    role="tab" 
                                    id="tab-login"
                                    aria-selected="true"
                                    aria-controls="panel-login"
                                    onclick="switchAuthTab('login')">
                                <span>登录</span>
                            </button>
                            <button class="auth-tab" 
                                    role="tab" 
                                    id="tab-register"
                                    aria-selected="false"
                                    aria-controls="panel-register"
                                    onclick="switchAuthTab('register')">
                                <span>注册</span>
                            </button>
                            <div class="tab-indicator"></div>
                        </div>

                        <!-- 登录面板 -->
                        <div class="auth-panel active" 
                             role="tabpanel" 
                             id="panel-login"
                             aria-labelledby="tab-login">
                            <form class="auth-form" novalidate onsubmit="event.preventDefault(); login();">
                                <div class="form-group">
                                    <label class="form-label" for="loginEmail">邮箱地址</label>
                                    <div class="input-wrapper">
                                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <rect x="2" y="4" width="20" height="16" rx="2"/>
                                            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                                        </svg>
                                        <input id="loginEmail" 
                                               type="email" 
                                               name="email"
                                               placeholder="your@email.com" 
                                               autocomplete="email"
                                               aria-required="true"
                                               required />
                                    </div>
                                </div>

                                <div class="form-group">
                                    <label class="form-label" for="loginPassword">
                                        <span>密码</span>
                                        <a href="#" class="forgot-password" onclick="showForgotPassword(); return false;">忘记密码？</a>
                                    </label>
                                    <div class="input-wrapper">
                                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                                        </svg>
                                        <input id="loginPassword" 
                                               type="password" 
                                               name="password"
                                               placeholder="输入密码" 
                                               autocomplete="current-password"
                                               aria-required="true"
                                               required />
                                        <button type="button" 
                                                class="password-toggle" 
                                                onclick="togglePassword('loginPassword')"
                                                aria-label="显示密码">
                                            <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                                                <circle cx="12" cy="12" r="3"/>
                                            </svg>
                                        </button>
                                    </div>
                                </div>

                                <div class="form-options">
                                    <label class="checkbox-wrapper">
                                        <input type="checkbox" id="rememberMe" checked />
                                        <span class="checkbox-custom"></span>
                                        <span class="checkbox-label">记住我</span>
                                    </label>
                                </div>

                                <div class="auth-message" id="loginMessage" role="alert" aria-live="polite"></div>

                                <button type="submit" class="btn btn-primary btn-full">
                                    <span>登录</span>
                                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <line x1="5" y1="12" x2="19" y2="12"/>
                                        <polyline points="12 5 19 12 12 19"/>
                                    </svg>
                                </button>
                            </form>
                        </div>

                        <!-- 注册面板 -->
                        <div class="auth-panel" 
                             role="tabpanel" 
                             id="panel-register"
                             aria-labelledby="tab-register"
                             hidden>
                            <form class="auth-form" novalidate onsubmit="event.preventDefault(); register();">
                                <div class="form-group">
                                    <label class="form-label" for="regUsername">用户名</label>
                                    <div class="input-wrapper">
                                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                            <circle cx="12" cy="7" r="4"/>
                                        </svg>
                                        <input id="regUsername" 
                                               type="text" 
                                               name="username"
                                               placeholder="设置用户名" 
                                               autocomplete="username"
                                               aria-required="true"
                                               required />
                                    </div>
                                </div>

                                <div class="form-group">
                                    <label class="form-label" for="regEmail">邮箱地址</label>
                                    <div class="input-wrapper">
                                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <rect x="2" y="4" width="20" height="16" rx="2"/>
                                            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                                        </svg>
                                        <input id="regEmail" 
                                               type="email" 
                                               name="email"
                                               placeholder="your@email.com" 
                                               autocomplete="email"
                                               aria-required="true"
                                               required />
                                    </div>
                                </div>

                                <div class="form-group">
                                    <label class="form-label" for="regPassword">密码</label>
                                    <div class="input-wrapper">
                                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                                        </svg>
                                        <input id="regPassword" 
                                               type="password" 
                                               name="password"
                                               placeholder="设置密码（至少6位）" 
                                               autocomplete="new-password"
                                               minlength="6"
                                               aria-required="true"
                                               required />
                                        <button type="button" 
                                                class="password-toggle" 
                                                onclick="togglePassword('regPassword')"
                                                aria-label="显示密码">
                                            <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                                                <circle cx="12" cy="12" r="3"/>
                                            </svg>
                                        </button>
                                    </div>
                                    <span class="input-hint">密码长度至少6个字符</span>
                                </div>

                                <div class="auth-message" id="registerMessage" role="alert" aria-live="polite"></div>

                                <button type="submit" class="btn btn-primary btn-full">
                                    <span>创建账户</span>
                                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <line x1="5" y1="12" x2="19" y2="12"/>
                                        <polyline points="12 5 19 12 12 19"/>
                                    </svg>
                                </button>
                            </form>
                        </div>

                        <!-- 分隔线 -->
                        <div class="auth-divider">
                            <span>或使用以下方式</span>
                        </div>

                        <!-- 社交登录 -->
                        <div class="social-login">
                            <button class="btn btn-social" onclick="socialLogin('google')" aria-label="使用 Google 登录">
                                <svg class="social-icon" viewBox="0 0 24 24">
                                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                                </svg>
                                <span>Google</span>
                            </button>
                            <button class="btn btn-social" onclick="socialLogin('github')" aria-label="使用 GitHub 登录">
                                <svg class="social-icon" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                                </svg>
                                <span>GitHub</span>
                            </button>
                        </div>
                    </div>
                </section>

                <!-- 应用区域 -->
                <section id="appBox" class="app-container-content" aria-labelledby="appTitle">
                    <!-- 写日记卡片 -->
                    <div class="card">
                        <div class="card-header">
                            <h2 class="card-title" id="appTitle">
                                <span>写一条今天的日记</span>
                            </h2>
                        </div>
                        <div class="card-body">
                            <textarea id="content" 
                                      placeholder="今天发生了什么有趣的事情？记录下来吧..."
                                      aria-label="日记内容输入框"
                                      aria-describedby="contentHint"
                                      rows="6"></textarea>
                            <span class="input-helper" id="contentHint">记录您的想法、感受和经历</span>
                            <div class="voice-toolbar" aria-label="语音输入工具">
                                <button class="btn btn-secondary voice-btn" type="button" id="recordBtn" onclick="toggleRecording()" aria-label="开始语音输入">
                                    <svg class="voice-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
                                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                                        <line x1="12" y1="19" x2="12" y2="22"></line>
                                        <line x1="8" y1="22" x2="16" y2="22"></line>
                                    </svg>
                                    <span id="recordBtnText">语音输入</span>
                                </button>
                                <button class="btn btn-outline voice-upload-btn" type="button" id="audioUploadBtn" onclick="openAudioFilePicker()" aria-label="上传录音文件">
                                    <svg class="voice-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                        <polyline points="17 8 12 3 7 8"></polyline>
                                        <line x1="12" y1="3" x2="12" y2="15"></line>
                                    </svg>
                                    <span>上传录音</span>
                                </button>
                                <input id="audioFileInput" type="file" accept=".flac,.mp3,.mp4,.mpeg,.mpga,.m4a,.ogg,.wav,.webm,audio/*" hidden onchange="handleAudioFileInput(event)">
                                <span class="voice-status" id="voiceStatus" role="status" aria-live="polite">录音会由本地 faster-whisper 转写为文本</span>
                            </div>
                        </div>
                        <div class="card-footer">
                            <div class="button-row">
                                <button class="btn btn-primary" onclick="submitEntry()" id="submitBtn" aria-label="提交日记">
                                    <span>提交</span>
                                </button>
                                <button class="btn btn-outline" onclick="loadWeeklyReport()" id="weeklyBtn" aria-label="生成本周周报">
                                    <span>生成本周周报</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- 周报卡片 -->
                    <div class="card weekly-report-card" id="weeklyReportCard" aria-labelledby="weeklyReportTitle">
                        <div class="card-header">
                            <h2 class="card-title" id="weeklyReportTitle">
                                <span>本周周报</span>
                            </h2>
                        </div>
                        <div class="card-body">
                            <div id="weeklyLoading" class="loading-container" aria-live="polite">
                                <div class="loading-spinner" aria-hidden="true"></div>
                                <span>正在分析本周记录...</span>
                            </div>
                            <div id="weeklyReportContent" aria-live="polite">
                                <div class="report-section">
                                    <div class="section-content">
                                        <h3 class="section-title">本周总结</h3>
                                        <p id="weeklySummary"></p>
                                    </div>
                                </div>

                                <div class="report-section">
                                    <div class="section-content">
                                        <h3 class="section-title">情绪概览</h3>
                                        <p id="moodOverview"></p>
                                    </div>
                                </div>

                                <div class="report-section">
                                    <div class="section-content">
                                        <h3 class="section-title">本周重点待办</h3>
                                        <ul id="weeklyTodos" class="todo-list" role="list"></ul>
                                    </div>
                                </div>

                                <div class="report-section">
                                    <div class="section-content">
                                        <h3 class="section-title">下周建议</h3>
                                        <p id="nextWeekSuggestion"></p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 日记列表 -->
                    <div id="entries" class="entries-container" aria-live="polite"></div>
                </section>
            </div>
        </main>

        <!-- Toast 提示 -->
        <div class="toast-container" id="toastContainer" role="status" aria-live="polite">
            <div class="toast" id="toast" role="alert">
                <div class="toast-content">
                    <span class="toast-message" id="toastMessage"></span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const AUDIO_SIZE_LIMIT = 25 * 1024 * 1024;
        const AUDIO_EXTENSIONS = [".flac", ".mp3", ".mp4", ".mpeg", ".mpga", ".m4a", ".ogg", ".wav", ".webm"];
        let mediaRecorder = null;
        let voiceStream = null;
        let recordedChunks = [];
        let isRecording = false;

        function setAuthMessage(msg) {
            const authMessage = document.getElementById("authMessage");
            authMessage.textContent = msg;
            authMessage.style.display = msg ? "block" : "none";
        }

        function getToken() {
            return localStorage.getItem("token");
        }

        function showApp() {
            const token = getToken();
            const authBox = document.getElementById("authBox");
            const appBox = document.getElementById("appBox");
            const sidebar = document.getElementById("sidebar");
            const isDesktop = window.innerWidth >= 1024;
            
            if (token) {
                authBox.style.display = "none";
                appBox.style.display = "block";
                sidebar.style.display = "flex";
                
                if (isDesktop) {
                    sidebar.classList.add("sidebar-visible");
                    sidebar.classList.remove("sidebar-hidden");
                } else {
                    sidebar.classList.add("sidebar-hidden");
                    sidebar.classList.remove("sidebar-visible");
                }
                
                loadCurrentUser();
                loadEntries();
                loadHistory();
            } else {
                authBox.style.display = "block";
                appBox.style.display = "none";
                sidebar.style.display = "none";
            }
        }

        async function loadCurrentUser() {
            const token = getToken();
            if (!token) return;

            try {
                const res = await fetch("/me", {
                    headers: { "Authorization": `Bearer ${token}` }
                });

                if (res.status === 401) {
                    localStorage.removeItem("token");
                    setAuthMessage("登录已过期，请重新登录");
                    showApp();
                    return;
                }

                if (!res.ok) {
                    console.error("获取当前用户失败");
                    return;
                }

                const data = await res.json();
                document.getElementById("currentUserText").textContent = data.username;
                document.getElementById("sidebarUserName").textContent = data.username;
            } catch (error) {
                console.error("加载用户信息失败:", error);
            }
        }

        // Tab 切换功能
        function switchAuthTab(tab) {
            const loginTab = document.getElementById('tab-login');
            const registerTab = document.getElementById('tab-register');
            const loginPanel = document.getElementById('panel-login');
            const registerPanel = document.getElementById('panel-register');
            const indicator = document.querySelector('.tab-indicator');
            
            if (tab === 'login') {
                loginTab.classList.add('active');
                loginTab.setAttribute('aria-selected', 'true');
                registerTab.classList.remove('active');
                registerTab.setAttribute('aria-selected', 'false');
                loginPanel.classList.add('active');
                loginPanel.removeAttribute('hidden');
                registerPanel.classList.remove('active');
                registerPanel.setAttribute('hidden', '');
                indicator.style.transform = 'translateX(0)';
            } else {
                registerTab.classList.add('active');
                registerTab.setAttribute('aria-selected', 'true');
                loginTab.classList.remove('active');
                loginTab.setAttribute('aria-selected', 'false');
                registerPanel.classList.add('active');
                registerPanel.removeAttribute('hidden');
                loginPanel.classList.remove('active');
                loginPanel.setAttribute('hidden', '');
                indicator.style.transform = 'translateX(100%)';
            }
        }

        function togglePassword(inputId) {
            const passwordInput = document.getElementById(inputId);
            const isPassword = passwordInput.type === "password";
            passwordInput.type = isPassword ? "text" : "password";
        }

        function setLoginMessage(msg) {
            const msgEl = document.getElementById("loginMessage");
            msgEl.textContent = msg;
            msgEl.style.display = msg ? "block" : "none";
        }

        function setRegisterMessage(msg) {
            const msgEl = document.getElementById("registerMessage");
            msgEl.textContent = msg;
            msgEl.style.display = msg ? "block" : "none";
        }

        function showForgotPassword() {
            showToast("请联系管理员重置密码", "info");
        }

        function socialLogin(provider) {
            showToast(`${provider} 登录功能即将上线`, "info");
        }

        async function register() {
            const username = document.getElementById("regUsername").value.trim();
            const email = document.getElementById("regEmail").value.trim();
            const password = document.getElementById("regPassword").value.trim();

            if (!username || !email || !password) {
                setRegisterMessage("请填写所有必填项");
                return;
            }

            if (password.length < 6) {
                setRegisterMessage("密码长度至少6个字符");
                return;
            }

            try {
                const res = await fetch("/register", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, email, password })
                });

                const data = await res.json();

                if (!res.ok) {
                    setRegisterMessage(data.detail || "注册失败");
                    return;
                }

                setRegisterMessage("");
                showToast("注册成功，请登录", "success");
                switchAuthTab('login');
            } catch (error) {
                setRegisterMessage("网络错误，请稍后重试");
                console.error("注册失败:", error);
            }
        }

        async function login() {
            const email = document.getElementById("loginEmail").value.trim();
            const password = document.getElementById("loginPassword").value.trim();

            if (!email || !password) {
                setLoginMessage("请输入邮箱和密码");
                return;
            }

            try {
                const formData = new URLSearchParams();
                formData.append("username", email);
                formData.append("password", password);

                const res = await fetch("/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: formData
                });

                const data = await res.json();

                if (!res.ok) {
                    setLoginMessage(data.detail || "邮箱或密码错误");
                    return;
                }

                localStorage.setItem("token", data.access_token);
                showToast("登录成功", "success");
                showApp();
            } catch (error) {
                setLoginMessage("网络错误，请稍后重试");
                console.error("登录失败:", error);
            }
        }

        function logout() {
            localStorage.removeItem("token");
            location.reload();
        }

        function newEntry() {
            document.getElementById("content").value = "";
            document.getElementById("content").focus();
            document.getElementById("entries").scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function escapeHtml(value) {
            return String(value ?? "").replace(/[&<>"']/g, char => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            }[char]));
        }

        function normalizeMood(mood) {
            const allowedMoods = new Set(["开心", "焦虑", "平静", "疲惫", "沮丧", "未知"]);
            const value = String(mood || "未知");
            return allowedMoods.has(value) ? value : "未知";
        }

        async function loadHistory() {
            const container = document.getElementById("historyList");
            if (!container) return;

            const token = getToken();
            
            try {
                const res = await fetch("/entries", {
                    headers: { "Authorization": `Bearer ${token}` }
                });

                if (res.status === 401) {
                    localStorage.removeItem("token");
                    showApp();
                    return;
                }

                if (!res.ok) {
                    throw new Error("获取历史记录失败");
                }

                const data = await res.json();
                container.innerHTML = "";

                if (data.length === 0) {
                    container.innerHTML = `
                        <div class="history-empty" role="status">
                            <span>暂无历史记录</span>
                        </div>
                    `;
                    return;
                }

                data.forEach(entry => {
                    const entryId = Number(entry.id);
                    if (!Number.isInteger(entryId)) return;

                    const preview = entry.content.substring(0, 40) + (entry.content.length > 40 ? "..." : "");
                    const previewHtml = escapeHtml(preview);
                    const dateHtml = escapeHtml(formatDate(entry.created_at));
                    const html = `
                        <button class="history-item" 
                                onclick="viewEntry(${entryId})"
                                aria-label="查看日记: ${previewHtml}">
                            <span class="history-preview">${previewHtml}</span>
                            <span class="history-date">${dateHtml}</span>
                        </button>
                    `;
                    container.innerHTML += html;
                });
            } catch (error) {
                console.error("加载历史记录失败:", error);
            }
        }

        async function viewEntry(entryId) {
            const token = getToken();
            try {
                const res = await fetch(`/entries/${entryId}`, {
                    headers: { "Authorization": `Bearer ${token}` }
                });

                if (!res.ok) {
                    throw new Error("获取日记详情失败");
                }

                const data = await res.json();
                document.getElementById("content").value = data.content;
                document.getElementById("content").focus();
                
                const element = document.getElementById("content");
                element.scrollIntoView({ behavior: 'smooth', block: 'center' });
            } catch (error) {
                console.error("查看日记失败:", error);
                showToast("查看失败", "error");
            }
        }

        async function loadEntries() {
            const container = document.getElementById("entries");
            if (!container) return;

            const token = getToken();
            
            try {
                const res = await fetch("/entries", {
                    headers: { "Authorization": `Bearer ${token}` }
                });

                if (res.status === 401) {
                    localStorage.removeItem("token");
                    setAuthMessage("登录已过期，请重新登录");
                    showApp();
                    return;
                }

                if (!res.ok) {
                    throw new Error("获取日记列表失败");
                }

                const data = await res.json();
                container.innerHTML = "";

                if (data.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state" role="status">
                            <p>暂无日记记录，开始写第一篇吧！</p>
                        </div>
                    `;
                    return;
                }

                data.forEach(entry => {
                    const entryId = Number(entry.id);
                    if (!Number.isInteger(entryId)) return;

                    const mood = normalizeMood(entry.mood);
                    const contentHtml = escapeHtml(entry.content);
                    const summaryHtml = escapeHtml(entry.summary || "暂无总结");
                    const dateHtml = escapeHtml(formatDate(entry.created_at));
                    const todos = Array.isArray(entry.todos) ? entry.todos : [];
                    const todosHtml = todos.length
                        ? `<ul class="todo-list" role="list">${todos.map((todo, i) => `<li role="listitem"><span class="todo-number">${i + 1}</span>${escapeHtml(todo)}</li>`).join("")}</ul>`
                        : `<p class="no-todo">暂无待办</p>`;

                    const html = `
                        <article class="card entry-card animate-fadeIn" aria-labelledby="entry-${entryId}-title">
                            <div class="entry-header">
                                <div class="entry-mood mood-${mood}" aria-label="心情: ${mood}">
                                    <span>${mood}</span>
                                </div>
                                <div class="entry-meta">${dateHtml}</div>
                            </div>

                            <div class="entry-section">
                                <h3 class="section-title" id="entry-${entryId}-title">原文</h3>
                                <p class="entry-content">${contentHtml}</p>
                            </div>

                            <div class="entry-section">
                                <h3 class="section-title">AI 总结</h3>
                                <p class="entry-summary">${summaryHtml}</p>
                            </div>

                            <div class="entry-section">
                                <h3 class="section-title">待办事项</h3>
                                ${todosHtml}
                            </div>

                            <button class="entry-delete-btn"
                                    onclick="deleteEntry(${entryId})"
                                    aria-label="删除这条日记"
                                    title="删除日记">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="3 6 5 6 21 6"></polyline>
                                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                </svg>
                            </button>
                        </article>
                    `;

                    container.innerHTML += html;
                });
            } catch (error) {
                console.error("加载日记失败:", error);
                container.innerHTML = `
                    <div class="empty-state" role="status">
                        <p>加载失败，请刷新页面重试</p>
                    </div>
                `;
            }
        }

        function setVoiceStatus(message) {
            const voiceStatus = document.getElementById("voiceStatus");
            if (voiceStatus) {
                voiceStatus.textContent = message;
            }
        }

        function getSupportedRecordingMimeType() {
            if (!window.MediaRecorder) return "";

            const mimeTypes = [
                "audio/webm;codecs=opus",
                "audio/webm",
                "audio/mp4",
                "audio/wav"
            ];

            return mimeTypes.find(type => MediaRecorder.isTypeSupported(type)) || "";
        }

        function audioExtensionFromMimeType(mimeType) {
            if (mimeType.includes("mp4")) return "m4a";
            if (mimeType.includes("wav")) return "wav";
            return "webm";
        }

        function setRecordingButtonState(recording) {
            const recordBtn = document.getElementById("recordBtn");
            const recordBtnText = document.getElementById("recordBtnText");
            const audioUploadBtn = document.getElementById("audioUploadBtn");

            if (!recordBtn || !recordBtnText) return;

            isRecording = recording;
            recordBtn.classList.toggle("is-recording", recording);
            recordBtn.setAttribute("aria-label", recording ? "停止语音输入" : "开始语音输入");
            recordBtnText.textContent = recording ? "停止录音" : "语音输入";

            if (audioUploadBtn) {
                audioUploadBtn.disabled = recording;
            }
        }

        function setVoiceControlsBusy(busy) {
            const recordBtn = document.getElementById("recordBtn");
            const audioUploadBtn = document.getElementById("audioUploadBtn");

            if (recordBtn) recordBtn.disabled = busy;
            if (audioUploadBtn) audioUploadBtn.disabled = busy;
        }

        function openAudioFilePicker() {
            document.getElementById("audioFileInput").click();
        }

        async function toggleRecording() {
            if (isRecording) {
                stopRecording();
                return;
            }

            await startRecording();
        }

        async function startRecording() {
            if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
                setVoiceStatus("当前浏览器不支持直接录音，可上传录音文件");
                showToast("当前浏览器不支持直接录音", "warning");
                return;
            }

            try {
                const mimeType = getSupportedRecordingMimeType();
                voiceStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                    }
                });

                mediaRecorder = new MediaRecorder(
                    voiceStream,
                    mimeType ? { mimeType } : {}
                );
                recordedChunks = [];

                mediaRecorder.addEventListener("dataavailable", event => {
                    if (event.data && event.data.size > 0) {
                        recordedChunks.push(event.data);
                    }
                });

                mediaRecorder.addEventListener("stop", () => {
                    handleRecordingStopped(mediaRecorder.mimeType || mimeType);
                });

                mediaRecorder.start();
                setRecordingButtonState(true);
                setVoiceStatus("正在录音，点击停止后自动识别");
            } catch (error) {
                releaseVoiceStream();
                setRecordingButtonState(false);
                setVoiceStatus("无法访问麦克风，请检查浏览器权限");
                showToast("无法访问麦克风", "error");
                console.error("录音启动失败:", error);
            }
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== "inactive") {
                mediaRecorder.stop();
                setVoiceStatus("录音结束，正在准备识别...");
            }
        }

        function releaseVoiceStream() {
            if (voiceStream) {
                voiceStream.getTracks().forEach(track => track.stop());
                voiceStream = null;
            }
        }

        async function handleRecordingStopped(mimeType) {
            releaseVoiceStream();
            setRecordingButtonState(false);

            if (!recordedChunks.length) {
                setVoiceStatus("没有录到声音，请重试");
                return;
            }

            const blob = new Blob(recordedChunks, { type: mimeType || "audio/webm" });
            recordedChunks = [];

            if (blob.size > AUDIO_SIZE_LIMIT) {
                setVoiceStatus("录音过大，请控制在 25MB 以内");
                showToast("录音文件过大", "error");
                return;
            }

            const extension = audioExtensionFromMimeType(mimeType || "");
            const audioFile = new File([blob], `journal-recording.${extension}`, {
                type: mimeType || "audio/webm"
            });

            await transcribeAudioFile(audioFile);
        }

        async function handleAudioFileInput(event) {
            const file = event.target.files?.[0];
            event.target.value = "";

            if (!file) return;
            await transcribeAudioFile(file);
        }

        function validateAudioFile(file) {
            const name = file.name.toLowerCase();
            const isAllowedExtension = AUDIO_EXTENSIONS.some(ext => name.endsWith(ext));

            if (!isAllowedExtension) {
                showToast("不支持的音频格式", "error");
                setVoiceStatus("支持 flac、mp3、mp4、mpeg、mpga、m4a、ogg、wav、webm");
                return false;
            }

            if (file.size > AUDIO_SIZE_LIMIT) {
                showToast("音频文件过大", "error");
                setVoiceStatus("音频文件需控制在 25MB 以内");
                return false;
            }

            return true;
        }

        function appendTranscriptToContent(text) {
            const contentInput = document.getElementById("content");
            const currentContent = contentInput.value;
            const separator = currentContent.trim() && !currentContent.endsWith("\n") ? "\n" : "";

            contentInput.value = `${currentContent}${separator}${text}`;
            contentInput.focus();
            contentInput.selectionStart = contentInput.selectionEnd = contentInput.value.length;
        }

        async function transcribeAudioFile(file) {
            if (!validateAudioFile(file)) return;

            const token = getToken();
            if (!token) {
                showToast("请先登录", "warning");
                showApp();
                return;
            }

            const formData = new FormData();
            formData.append("file", file);

            setVoiceControlsBusy(true);
            setVoiceStatus("正在上传并识别语音...");

            try {
                const res = await fetch("/speech/transcribe", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${token}` },
                    body: formData
                });

                const data = await res.json().catch(() => ({}));

                if (res.status === 401) {
                    localStorage.removeItem("token");
                    setAuthMessage("登录已过期，请重新登录");
                    showApp();
                    return;
                }

                if (!res.ok) {
                    const message = data.detail || "语音识别失败";
                    setVoiceStatus(message);
                    showToast(message, "error");
                    return;
                }

                if (!data.text) {
                    setVoiceStatus("没有识别到有效内容");
                    showToast("没有识别到有效内容", "warning");
                    return;
                }

                appendTranscriptToContent(data.text);
                setVoiceStatus("识别完成，已加入日记内容");
                showToast("语音识别完成", "success");
            } catch (error) {
                setVoiceStatus("语音识别请求失败，请稍后重试");
                showToast("语音识别请求失败", "error");
                console.error("语音识别失败:", error);
            } finally {
                setVoiceControlsBusy(false);
            }
        }

        async function submitEntry() {
            const token = getToken();
            const contentInput = document.getElementById("content");
            const button = document.getElementById("submitBtn");
            const content = contentInput.value.trim();
            
            if (!content) {
                showToast("请输入日记内容", "warning");
                contentInput.focus();
                return;
            }

            button.disabled = true;
            button.classList.add("is-loading");
            button.innerHTML = `
                <div class="btn-spinner" aria-hidden="true"></div>
                <span>分析中...</span>
            `;

            try {
                const res = await fetch("/entries", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify({ content })
                });

                if (!res.ok) {
                    showToast("提交失败", "error");
                    return;
                }

                contentInput.value = "";
                showToast("提交成功", "success");
                await loadEntries();
                await loadHistory();

            } catch (error) {
                showToast("请求失败，请稍后重试", "error");
                console.error("提交日记失败:", error);
            } finally {
                button.disabled = false;
                button.classList.remove("is-loading");
                button.innerHTML = `
                    <span>提交</span>
                `;
            }
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, "0");
            const day = String(date.getDate()).padStart(2, "0");
            const hours = String(date.getHours()).padStart(2, "0");
            const minutes = String(date.getMinutes()).padStart(2, "0");
            return `${month}-${day} ${hours}:${minutes}`;
        }

        async function deleteEntry(entryId) {
            const token = getToken();
            const ok = confirm("确认删除这条日记吗？");
            if (!ok) return;

            try {
                const res = await fetch(`/entries/${entryId}`, {
                    method: "DELETE",
                    headers: { "Authorization": `Bearer ${token}` }
                });

                if (!res.ok) {
                    showToast("删除失败", "error");
                    return;
                }

                showToast("删除成功", "success");
                await loadEntries();
                await loadHistory();

            } catch (error) {
                showToast("请求失败，请稍后重试", "error");
                console.error("删除日记失败:", error);
            }
        }

        let weeklyReportLoading = false;

        async function loadWeeklyReport() {
            if (weeklyReportLoading) return;

            const token = getToken();
            const btn = document.getElementById("weeklyBtn");
            const card = document.getElementById("weeklyReportCard");
            const loadingBox = document.getElementById("weeklyLoading");
            const contentBox = document.getElementById("weeklyReportContent");
            const todosEl = document.getElementById("weeklyTodos");

            weeklyReportLoading = true;
            btn.disabled = true;
            btn.classList.add("is-loading");
            btn.innerHTML = `
                <div class="btn-spinner" aria-hidden="true"></div>
                <span>分析中...</span>
            `;

            card.style.display = "block";
            loadingBox.style.display = "flex";
            contentBox.style.display = "none";
            todosEl.innerHTML = "";

            try {
                const res = await fetch("/weekly-report", {
                    headers: { "Authorization": `Bearer ${token}` }
                });

                if (!res.ok) {
                    throw new Error("周报请求失败");
                }

                const data = await res.json();

                document.getElementById("weeklySummary").textContent = data.weekly_summary || "暂无";
                document.getElementById("moodOverview").textContent = data.mood_overview || "暂无";
                document.getElementById("nextWeekSuggestion").textContent = data.next_week_suggestion || "暂无";

                (data.key_todos || []).forEach((todo, i) => {
                    const li = document.createElement("li");
                    li.setAttribute('role', 'listitem');
                    const number = document.createElement("span");
                    number.className = "todo-number";
                    number.textContent = i + 1;
                    li.appendChild(number);
                    li.appendChild(document.createTextNode(String(todo)));
                    todosEl.appendChild(li);
                });

                loadingBox.style.display = "none";
                contentBox.style.display = "block";

            } catch (error) {
                loadingBox.innerHTML = `
                    <span>周报生成失败，请稍后重试</span>
                `;
                contentBox.style.display = "none";
                console.error("加载周报失败:", error);
            } finally {
                weeklyReportLoading = false;
                btn.disabled = false;
                btn.classList.remove("is-loading");
                btn.innerHTML = `
                    <span>生成本周周报</span>
                `;
            }
        }

        function showToast(message, type = "info") {
            const toast = document.getElementById("toast");
            const toastMessage = document.getElementById("toastMessage");

            toastMessage.textContent = message;
            toast.className = `toast toast-${type}`;

            toast.style.display = "flex";

            setTimeout(() => {
                toast.classList.add("toast-hide");
                setTimeout(() => {
                    toast.style.display = "none";
                    toast.classList.remove("toast-hide");
                }, 300);
            }, 3000);
        }

        function toggleSidebar() {
            const sidebar = document.getElementById("sidebar");
            const mainContent = document.getElementById("mainContent");
            const sidebarToggle = document.getElementById("sidebarToggle");
            
            const isVisible = sidebar.classList.contains("sidebar-visible");
            
            if (isVisible) {
                sidebar.classList.remove("sidebar-visible");
                sidebar.classList.add("sidebar-hidden");
                mainContent.classList.remove("main-content-expanded");
            } else {
                sidebar.classList.remove("sidebar-hidden");
                sidebar.classList.add("sidebar-visible");
                mainContent.classList.add("main-content-expanded");
            }
            
            sidebarToggle.setAttribute('aria-expanded', !isVisible);
            sidebar.setAttribute('aria-hidden', isVisible);
        }

        function getTheme() {
            return localStorage.getItem("theme") || "dark";
        }

        function setTheme(theme) {
            localStorage.setItem("theme", theme);
            const html = document.documentElement;
            const themeToggle = document.getElementById("themeToggle");
            
            if (theme === "dark") {
                html.classList.add("dark-theme");
                html.classList.remove("light-theme");
                if (themeToggle) {
                    themeToggle.querySelector('.theme-icon').textContent = '🌙';
                    themeToggle.querySelector('.theme-text').textContent = '深色';
                    themeToggle.setAttribute('aria-label', '切换到浅色主题');
                }
            } else {
                html.classList.add("light-theme");
                html.classList.remove("dark-theme");
                if (themeToggle) {
                    themeToggle.querySelector('.theme-icon').textContent = '☀️';
                    themeToggle.querySelector('.theme-text').textContent = '浅色';
                    themeToggle.setAttribute('aria-label', '切换到深色主题');
                }
            }
        }

        function toggleTheme() {
            const currentTheme = getTheme();
            const newTheme = currentTheme === "dark" ? "light" : "dark";
            setTheme(newTheme);
        }

        function loadTheme() {
            const savedTheme = getTheme();
            setTheme(savedTheme);
        }

        window.onload = function() {
            loadTheme();
            showApp();
        };
    </script>
